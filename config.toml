# Weekly AI digest bot. Secrets (SLACK_WEBHOOK_URL, SMTP_PASSWORD, ANTHROPIC_API_KEY) live in .env only.
# Every setting: docs/configuration.md. Try it without sending anything:
#   automation run weekly-ai-digest --dry-run

timezone = "Asia/Kolkata"             # the schedule below is Mondays 07:00 IST

[log]
level = "INFO"
format = "text"

[state]
path = "state/automation.db"          # remembers which posts were already sent

[http]
timeout_seconds = 45                  # openai.com/news/rss.xml is a large, slow feed
retries = 3
user_agent = "weekly-ai-digest/1.0 (+https://avnishyadav.com)"

[notify]
default = ["console"]
on_failure = ["email", "console"]     # a failed run emails you (and prints to the launchd log)

[notify.email]
# Gmail SMTP with the same EMAIL_USER / EMAIL_PASS (a Gmail app password) as avnishyadav.com's fallback mailer.
# username, sender and recipients default to EMAIL_USER; set them here to send elsewhere.
host = "smtp.gmail.com"
port = 587
security = "starttls"

[llm]
provider = "deepseek"                 # needs DEEPSEEK_API_KEY in .env; without it the digest goes out unsummarised
model = "deepseek-chat"

[jobs.weekly-ai-digest]
schedule = "0 7 * * 1"
feeds = [
  "https://openai.com/news/rss.xml",
  "https://deepmind.google/blog/rss.xml",
  "https://blog.google/technology/ai/rss/",
  "https://huggingface.co/blog/feed.xml",
  "https://engineering.salesforce.com/feed/",
]
# Anthropic has no RSS feed; developer.salesforce.com/blogs/feed refuses automated clients (HTTP 403).
names = { "https://blog.google/technology/ai/rss/" = "Google AI blog" }   # the feed calls itself just "AI"
lookback_days = 8
max_per_source = 8
summarize = true
email_channels = ["email"]
slack_channels = ["slack"]
